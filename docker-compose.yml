version: '3.8'

services:
  angular-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: angular-web
    ports:
      - "80:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  default:
    name: app-network
