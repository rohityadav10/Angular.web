# nginx site for the Angular SPA (non-root nginx-unprivileged image, port 8080).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # add_header in a location replaces the server-level ones, so every location includes the set.
    include /etc/nginx/snippets/security-headers.conf;

    # Written per environment at container start; must never be cached.
    location = /config.json {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # The app shell references the current hashed bundles; revalidate it on every load.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Bundles are content-hashed (outputHashing: all), so they can be cached for a year.
    location ~* \.(?:js|css|woff2?|ttf|eot|ico|png|jpe?g|gif|svg|webp)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA routing: unknown paths get the app shell (internal redirect to /index.html above).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
