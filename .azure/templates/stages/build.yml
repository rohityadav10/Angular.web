# Build stage for Angular.web. Runs for every trigger: feature/* pushes, PRs, and merges.
# Every gate here fails the stage; nothing downstream (image push, SIT...) runs past a failure.
#
#   BuildTest ──┐
#               ├──> Container (docker build -> Trivy image gate -> push, merges only)
#   Security  ──┘
#
# Gates, in pipeline order:
#   BuildTest  unit tests (any failure), line coverage (< coverageThreshold)
#   Security   SAST: Semgrep (ERROR/HIGH/CRITICAL); dependencies: Trivy on package-lock.json,
#              devDependencies included (fixable HIGH/CRITICAL)
#   Container  image: Trivy (fixable HIGH/CRITICAL in OS packages)
# Each gate writes a summary-*.json into a quality-* artifact: the evidence PROD re-checks.
parameters:
  - name: enableSonarCloud
    type: boolean
    default: false

stages:
  - stage: Build
    displayName: Build, test & scan
    jobs:
      # ── Install, build, test, coverage, publish IIS drop ──────────────────────
      - job: BuildTest
        displayName: Build & test (Angular)
        pool:
          vmImage: ubuntu-24.04
        variables:
          npm_config_cache: $(Pipeline.Workspace)/.npm
          appDir: angular.web
          reportDir: $(Build.ArtifactStagingDirectory)/quality
        steps:
          - checkout: self
            fetchDepth: 0   # full history: SonarCloud blame / new-code detection

          - task: UseNode@1
            displayName: Use Node.js $(nodeVersion)
            inputs:
              version: $(nodeVersion)

          - task: Cache@2
            displayName: Cache npm
            inputs:
              key: 'npm | "$(Agent.OS)" | angular.web/package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: $(npm_config_cache)

          - script: npm ci --no-audit --no-fund
            displayName: Install (npm ci)
            workingDirectory: $(appDir)

          - script: npx ng build --configuration production
            displayName: Build (production configuration)
            workingDirectory: $(appDir)

          # The hosted Ubuntu image ships Chrome and sets CHROME_BIN; karma.conf.ci.js runs it headless.
          - script: npx ng test --watch=false --browsers=ChromeHeadlessCI --code-coverage --karma-config=karma.conf.ci.js
            displayName: Unit tests (Jasmine/Karma) + coverage
            workingDirectory: $(appDir)

          - task: PublishTestResults@2
            displayName: Publish test results (JUnit)
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: $(appDir)/test-results/junit.xml
              testRunTitle: Angular.web unit tests
              failTaskOnFailedTests: true
              failTaskOnMissingResultsFile: true

          - task: PublishCodeCoverageResults@2
            displayName: Publish coverage (Cobertura, HTML report tab)
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: $(appDir)/coverage/cobertura-coverage.xml

          - task: PowerShell@2
            name: gate
            displayName: 'Gate: 100% tests pass, coverage >= $(coverageThreshold)%'
            condition: succeededOrFailed()
            inputs:
              targetType: filePath
              filePath: .azure/scripts/quality-gate.ps1
              arguments: >
                -TestResults '$(appDir)/test-results/junit.xml'
                -Coverage '$(appDir)/coverage/cobertura-coverage.xml'
                -Threshold $(coverageThreshold)
                -ReportDir '$(reportDir)'
              pwsh: true

          - ${{ if parameters.enableSonarCloud }}:
            - task: SonarCloudPrepare@3
              displayName: SonarCloud - prepare
              inputs:
                SonarCloud: $(sonarCloudServiceConnection)
                organization: $(sonarCloudOrganization)
                scannerMode: cli
                configMode: manual
                cliProjectKey: $(sonarCloudProjectKey)
                cliSources: angular.web/src
                extraProperties: |
                  sonar.exclusions=**/*.spec.ts
                  sonar.tests=angular.web/src
                  sonar.test.inclusions=**/*.spec.ts
                  sonar.javascript.lcov.reportPaths=angular.web/coverage/lcov.info
                  sonar.qualitygate.wait=true
            - task: SonarCloudAnalyze@3
              displayName: SonarCloud - analyze (fails on quality gate)
            - task: SonarCloudPublish@3
              displayName: SonarCloud - publish
              inputs:
                pollingTimeoutSec: '300'

          # Only the browser bundle goes to IIS; the SSR server output is not deployed.
          - publish: $(appDir)/dist/angular.web/browser
            artifact: web-drop
            displayName: 'Artifact: web-drop (IIS)'

          - publish: .azure/scripts
            artifact: deploy-scripts
            displayName: 'Artifact: deploy-scripts'

          - publish: $(reportDir)
            artifact: quality-tests
            displayName: 'Evidence: quality-tests'
            condition: succeededOrFailed()

      # ── SAST and dependency scanning (parallel with BuildTest) ─────────────────
      - job: Security
        displayName: SAST & dependency scan
        pool:
          vmImage: ubuntu-24.04
        variables:
          reportDir: $(Build.ArtifactStagingDirectory)/quality
          sarifDir: $(Build.ArtifactStagingDirectory)/CodeAnalysisLogs
        steps:
          - checkout: self
            fetchDepth: 1

          # 'Dockerfile' excludes only the repository-root Dockerfile, which the GitHub workflows
          # build and ship. Its known finding (nginx runs as root) is documented in
          # README-PIPELINE.md. This pipeline ships .azure/docker/Dockerfile.frontend, which is scanned.
          - task: PowerShell@2
            displayName: 'Gate: SAST (Semgrep)'
            inputs:
              targetType: filePath
              filePath: .azure/scripts/semgrep-scan.ps1
              arguments: >
                -Configs 'p/typescript,p/javascript,p/secrets,p/owasp-top-ten,p/dockerfile'
                -Exclude '*.spec.ts,Dockerfile'
                -ReportDir '$(reportDir)'
                -SemgrepImage '$(semgrepImage)'
              pwsh: true

          - task: PowerShell@2
            displayName: 'Gate: vulnerable npm packages (Trivy, High/Critical)'
            condition: succeededOrFailed()
            inputs:
              targetType: filePath
              filePath: .azure/scripts/trivy-scan.ps1
              arguments: -ScanType fs -Target angular.web -Name dependencies -ReportDir '$(reportDir)' -TrivyImage '$(trivyImage)' -Sbom
              pwsh: true

          # "CodeAnalysisLogs" is the artifact name the SARIF SAST Scans Tab extension renders.
          - pwsh: |
              New-Item -ItemType Directory -Path '$(sarifDir)' -Force | Out-Null
              Copy-Item '$(reportDir)/*.sarif' '$(sarifDir)' -ErrorAction SilentlyContinue
            displayName: Collect SARIF
            condition: succeededOrFailed()
          - publish: $(sarifDir)
            artifact: CodeAnalysisLogs
            displayName: 'Artifact: CodeAnalysisLogs (SARIF)'
            condition: succeededOrFailed()
          - publish: $(reportDir)
            artifact: quality-security
            displayName: 'Evidence: quality-security (+ SBOM)'
            condition: succeededOrFailed()

      # ── Container image: build, scan, push (push only for deployable builds) ────
      - job: Container
        displayName: Docker image, scan & push
        dependsOn: [BuildTest, Security]
        pool:
          vmImage: ubuntu-24.04
        variables:
          imageRef: $(acrLoginServer)/angular-web:$(Build.BuildNumber)
          reportDir: $(Build.ArtifactStagingDirectory)/quality
        steps:
          - checkout: self
            fetchDepth: 1

          - script: >
              docker build
              --file .azure/docker/Dockerfile.frontend
              --build-arg APP_VERSION=$(Build.BuildNumber)
              --label org.opencontainers.image.revision=$(Build.SourceVersion)
              --label org.opencontainers.image.source=$(Build.Repository.Uri)
              --tag $(imageRef)
              .
            displayName: docker build (Node build -> non-root nginx)
            env:
              DOCKER_BUILDKIT: 1

          - task: PowerShell@2
            displayName: 'Gate: image vulnerabilities (Trivy) + SBOM'
            inputs:
              targetType: filePath
              filePath: .azure/scripts/trivy-scan.ps1
              arguments: -ScanType image -Target '$(imageRef)' -Name image -ReportDir '$(reportDir)' -TrivyImage '$(trivyImage)' -Sbom
              pwsh: true

          - task: AzureCLI@2
            displayName: Push to ACR (build once, promote everywhere)
            condition: and(succeeded(), eq(variables.isDeployable, 'true'))
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az acr login --name "$(acrName)"
                docker push "$(imageRef)"
                digest_ref="$(docker inspect --format '{{index .RepoDigests 0}}' "$(imageRef)")"
                mkdir -p "$(Build.ArtifactStagingDirectory)/image-info"
                jq -n --arg tag "$(imageRef)" --arg digest "$digest_ref" \
                      --arg build "$(Build.BuildNumber)" --arg commit "$(Build.SourceVersion)" \
                      '{tagRef: $tag, digestRef: $digest, build: $build, commit: $commit}' \
                  > "$(Build.ArtifactStagingDirectory)/image-info/image.json"
                cat "$(Build.ArtifactStagingDirectory)/image-info/image.json"

          - publish: $(Build.ArtifactStagingDirectory)/image-info
            artifact: image-info
            displayName: 'Artifact: image-info (tag + digest)'
            condition: and(succeeded(), eq(variables.isDeployable, 'true'))
          - publish: $(reportDir)
            artifact: quality-image
            displayName: 'Evidence: quality-image (+ SBOM)'
            condition: succeededOrFailed()

      # ── Notification ──────────────────────────────────────────────────────────
      - job: Notify
        displayName: Notify
        dependsOn: [BuildTest, Security, Container]
        condition: always()
        pool:
          vmImage: ubuntu-24.04
        variables:
          buildTestResult: $[ dependencies.BuildTest.result ]
          securityResult: $[ dependencies.Security.result ]
          containerResult: $[ dependencies.Container.result ]
          overall: $[ iif(and(eq(dependencies.BuildTest.result, 'Succeeded'), eq(dependencies.Security.result, 'Succeeded'), eq(dependencies.Container.result, 'Succeeded')), 'Succeeded', 'Failed') ]
        steps:
          - checkout: self
            fetchDepth: 1
          - template: ../steps/notify.yml
            parameters:
              stage: Build
              status: $(overall)
              detail: 'Build/test: $(buildTestResult). Security: $(securityResult). Image: $(containerResult).'
