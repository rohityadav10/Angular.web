# Angular.web: Azure DevOps CI/CD pipeline.
#
#   feature/* push, PR ─> Build (compile, test, coverage, SAST, deps, image scan)   no deployment
#   merge to release   ─> Build ─> SIT (IIS, auto) ─> UAT (IIS, approval) ─> PROD (Container Apps,
#                                                       approval + sign-off + business hours + preflight)
#
# One build is promoted unchanged: the IIS drop and the image digest from the Build stage are
# what every environment receives. Per-environment settings reach the SPA through config.json,
# written at deploy time (IIS) or container start (Container Apps).
# Independent of the GitHub Actions workflows in .github/, which keep running as before.
# Docs: README-PIPELINE.md (design) and .azure/SETUP.md (one-time Azure / Azure DevOps setup).

name: $(Date:yyyyMMdd)$(Rev:.r)   # e.g. 20260928.1 is the build number, image tag and app version

trigger:
  batch: true
  branches:
    include:
      - release        # this repository's integration ("main") branch
      - main           # kept so a rename to main needs no pipeline change
      - feature/*
  paths:
    exclude:
      - '**/*.md'

pr:
  branches:
    include:
      - release
      - main
  paths:
    exclude:
      - '**/*.md'

parameters:
  - name: prodTarget
    displayName: PROD deployment target
    type: string
    default: containerapps
    values: [containerapps, iis, both]
  - name: enableSonarCloud
    displayName: Run SonarCloud analysis (needs the extension + service connection, see SETUP.md)
    type: boolean
    default: false

variables:
  - template: templates/variables/common.yml
  - group: devops-exercise-shared          # TEAMS_WEBHOOK_URL (secret, optional)
  - name: nodeVersion
    value: 22.x
  # Only merges to the integration branch deploy or push images; feature branches and PRs build and scan.
  - name: isDeployable
    value: $[ and(in(variables['Build.SourceBranch'], 'refs/heads/release', 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest')) ]
  # Used only when enableSonarCloud is true.
  - name: sonarCloudServiceConnection
    value: sc-sonarcloud
  - name: sonarCloudOrganization
    value: CHANGE-ME
  - name: sonarCloudProjectKey
    value: Angular.web

stages:
  - template: templates/stages/build.yml
    parameters:
      enableSonarCloud: ${{ parameters.enableSonarCloud }}

  # ── SIT: automatic on merge ───────────────────────────────────────────────────
  - stage: SIT
    displayName: Deploy SIT (IIS)
    dependsOn: Build
    condition: and(succeeded(), eq(variables.isDeployable, 'true'))
    variables:
      - template: templates/variables/sit.yml
      - group: devops-exercise-sit
    jobs:
      - template: templates/jobs/deploy-iis.yml
        parameters:
          environment: sit
          artifactName: web-drop
          appType: Spa
          siteName: $(webIisSite)
          port: $(webIisPort)
          healthPath: /
          versionPath: /config.json
          spaConfig:
            environment: $(environmentLabel)
            apiBaseUrl: $(iisPublicHost):$(apiIisPort)
            version: $(Build.BuildNumber)

  # ── UAT: the 'uat' environment's approval check holds this stage ────────────────
  - stage: UAT
    displayName: Deploy UAT (IIS)
    dependsOn: SIT
    condition: and(succeeded(), eq(variables.isDeployable, 'true'))
    variables:
      - template: templates/variables/uat.yml
      - group: devops-exercise-uat
    jobs:
      - template: templates/jobs/deploy-iis.yml
        parameters:
          environment: uat
          artifactName: web-drop
          appType: Spa
          siteName: $(webIisSite)
          port: $(webIisPort)
          healthPath: /
          versionPath: /config.json
          spaConfig:
            environment: $(environmentLabel)
            apiBaseUrl: $(iisPublicHost):$(apiIisPort)
            version: $(Build.BuildNumber)

  # ── PROD: approval + second sign-off + business hours (environment checks), then preflight ─
  - stage: PROD
    displayName: Deploy PROD
    dependsOn: UAT
    condition: and(succeeded(), eq(variables.isDeployable, 'true'))
    variables:
      - template: templates/variables/prod.yml
      - group: devops-exercise-prod
    jobs:
      - template: templates/jobs/prod-preflight.yml
        parameters:
          requiredChecks: tests,sast,trivy-dependencies,trivy-image
          dependencyRescanSteps:
            - task: PowerShell@2
              displayName: Re-scan npm dependencies with current vulnerability data
              inputs:
                targetType: filePath
                filePath: .azure/scripts/trivy-scan.ps1
                arguments: -ScanType fs -Target angular.web -Name dependencies-rescan -ReportDir '$(rescanDir)' -TrivyImage '$(trivyImage)'
                pwsh: true

      - ${{ if in(parameters.prodTarget, 'containerapps', 'both') }}:
        - template: templates/jobs/deploy-containerapps.yml
          parameters:
            environment: prod
            dependsOn: [Preflight]
            containerApp: $(webContainerApp)
            healthPath: /
            versionPath: /config.json
            canaryPercent: $(canaryPercent)
            canarySeconds: $(canarySeconds)
            environmentVariables:
              APP_ENVIRONMENT: $(environmentLabel)
              API_BASE_URL: '{{fqdn:netcore-api}}'

      - ${{ if in(parameters.prodTarget, 'iis', 'both') }}:
        - template: templates/jobs/deploy-iis.yml
          parameters:
            environment: prod
            dependsOn: [Preflight]
            artifactName: web-drop
            appType: Spa
            siteName: $(webIisSite)
            port: $(webIisPort)
            healthPath: /
            versionPath: /config.json
            spaConfig:
              environment: $(environmentLabel)
              apiBaseUrl: $(iisPublicHost):$(apiIisPort)
              version: $(Build.BuildNumber)
