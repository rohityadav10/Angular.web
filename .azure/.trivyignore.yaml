# Accepted vulnerability risks for the Trivy gates (.azure/scripts/trivy-scan.ps1).
# Empty on purpose. An entry is a reviewed decision, not a way to turn a build green:
# give the reason, who approved it, and an expiry date. After that date Trivy stops
# honouring the entry and the gate fails again, forcing a re-review.
#
# vulnerabilities:
#   - id: CVE-2026-00000
#     paths: ["usr/lib/x86_64-linux-gnu/libexample.so"]
#     statement: "Not reachable: nginx never loads the affected module. Approved by <name>, <date>."
#     expired_at: 2026-12-31
vulnerabilities:
  - id: CVE-2026-76844
    paths: ["webpack-dev-middleware"]
    statement: "Accepted temporarily because webpack-dev-middleware is a transitive development/build dependency and is not directly used by the application runtime. Approved by <name>, 2026-09-30."
    expired_at: 2026-10-31
